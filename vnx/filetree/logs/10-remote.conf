# US-21 Servidor de logs. Recibe syslog remoto por UDP y TCP en el 514.
module(load="imudp")
input(type="imudp" port="514")
module(load="imtcp")
input(type="imtcp" port="514")

# Cada origen remoto en su propio fichero bajo /var/log/remote/<host>/
template(name="RemoteLogs" type="string" string="/var/log/remote/%HOSTNAME%/syslog.log")
if ($fromhost-ip != '127.0.0.1') then {
    action(type="omfile" dynaFile="RemoteLogs")
    stop
}
