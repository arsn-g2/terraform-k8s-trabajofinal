apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-configmap
data:
  group: X
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>NGINX server</title>
    </head>
    <body>
      <h1>Hello from Kubernetes!</h1>
      <p>This page is served by NGINX using a ConfigMap.</p>
      <p>Web server of CNVR/ARSN group X</p>
    </body>
    </html>

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        envFrom:
        - configMapRef:
            name: nginx-configmap
        ports:
        - containerPort: 80
        volumeMounts:
        - name: web-content
          mountPath: /usr/share/nginx/html
      volumes:
      - name: web-content
        configMap:
          name: nginx-configmap
