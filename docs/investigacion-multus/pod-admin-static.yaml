# Pod de prueba de la NAD del admin (US-11): IPAM static, IP fija 10.1.2.5 en la VLAN 1000
apiVersion: v1
kind: Pod
metadata:
  name: test-admin
  annotations:
    k8s.v1.cni.cncf.io/networks: '[{"name": "vlan1000-admin", "ips": ["10.1.2.5/24"]}]'
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker1
  containers:
  - name: alpine
    image: alpine
    command: ["/bin/ash", "-c", "trap : TERM INT; sleep infinity & wait"]