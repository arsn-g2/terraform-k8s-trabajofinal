    "cniVersion": "0.3.1",
    "type": "macvlan",
    "master": "e2.1000",
    "mode": "bridge",
    "ipam": {
      "type": "host-local",
      "ranges": [[ { "subnet": "10.1.2.0/24", "rangeStart": "10.1.2.10", "rangeEnd": "10.1.2.50" } ]]
    }
  }'
  